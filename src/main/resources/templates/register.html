<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register</title>
</head>
<body>
<form th:action="@{/auth/register}" th:object="${registerRequest}" method="post">
  Email: <input type="email" th:field="*{email}" required> <br> <br>
  Password: <input type="password" th:field="*{password}" required> <br><br>
  <button type="submit">Register user</button>
    <h1>Register page</h1>
    <p th:text="${message}"></p>
</form>

</body>
</html>
